name: Release

# Dois caminhos para publicar:
#
#  1. Pelo site: aba Actions -> Release -> "Run workflow" -> digitar a versao.
#     O proprio job sobe a versao nos 3 arquivos, commita, cria a tag e publica.
#  2. Na mao: git tag v2.1.0 && git push origin v2.1.0
#
# Por que tudo num workflow so, em vez de um que so cria a tag e "triga" este:
# eventos gerados pelo GITHUB_TOKEN NAO disparam outros workflows (o GitHub
# bloqueia para evitar loop). A tag seria criada e o release nunca aconteceria,
# sem erro nenhum. A alternativa seria um PAT — mais um segredo para vazar.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      versao:
        description: "Versao nova, sem o v (ex.: 2.1.0)"
        required: true
        type: string

jobs:
  release:
    # Windows e o unico alvo: o app le o Access via PowerShell/OLEDB.
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Na mao a tag ja existe; pelo site precisamos do branch para commitar.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Definir a versao a publicar
        id: versao
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.versao }}" >> "$GITHUB_OUTPUT"
            echo "numero=${{ inputs.versao }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "numero=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Subir a versao, commitar e criar a tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.versao.outputs.tag }}"; then
            echo "::error::A tag ${{ steps.versao.outputs.tag }} ja existe."
            exit 1
          fi
          node scripts/definir-versao.mjs "${{ steps.versao.outputs.numero }}"
          # Mantem o Cargo.lock coerente com a versao nova do pacote.
          (cd app/src-tauri && cargo update --workspace --quiet)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/src-tauri/tauri.conf.json app/src-tauri/Cargo.toml app/src-tauri/Cargo.lock
          git commit -m "Versao ${{ steps.versao.outputs.numero }}"
          # O commit vai PRIMEIRO. Se ele for recusado (main andou no meio do
          # caminho), o job morre aqui sem ter criado tag nenhuma. Na ordem
          # anterior a tag ia junto e sobrava apontando para o commit sem bump —
          # uma v2.1.0 cujo tauri.conf.json ainda dizia 2.0.0.
          git push origin HEAD:main
          git tag "${{ steps.versao.outputs.tag }}"
          git push origin "${{ steps.versao.outputs.tag }}"

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      # A suite roda antes de gerar release: versao quebrada nao chega no cliente.
      - name: Testes (TypeScript)
        working-directory: app
        run: npm test

      - name: Testes (Rust)
        working-directory: app/src-tauri
        run: cargo test

      - name: Build, assinatura e publicacao
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem estas duas o instalador sai sem .sig e o app recusa a atualizacao.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ steps.versao.outputs.tag }}
          releaseName: "Sistema Prado ${{ steps.versao.outputs.tag }}"
          releaseBody: "Instalador para Windows. O sistema ja instalado avisa da versao nova ao abrir."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
