[package]
name = "app"
version = "2.0.0"
description = "Sistema — Super Troca de Óleo Prado's"
authors = ["Rafael Prado"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Só para os testes async da validação do banco (o runtime já vem com o Tauri).
tokio = { version = "1", features = ["rt", "macros"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mesma versão que o tauri-plugin-sql já traz: usada só para conferir, em leitura,
# se um arquivo escolhido para restauração é mesmo um banco do Sistema Prado.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

